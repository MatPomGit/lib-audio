name: Scaffold CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Private descendants must opt in to potentially billed CI separately.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; node24
        with:
          python-version: '3.11'
      - name: Validate scaffold
        run: python scripts/validate_repository.py --phase scaffold
      - name: Check documentation budgets
        run: python scripts/validate_documentation.py
      - name: Check isolated public Pages
        run: python scripts/validate_pages.py
      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build and inspect approved Pages (never deploy)
        run: |
          python -m pip install --disable-pip-version-check "mkdocs==1.6.1"
          python -m mkdocs build --strict
          python scripts/validate_rendered_pages.py --strict
